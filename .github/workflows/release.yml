# ABOUTME: Release workflow — builds unsigned installers when a version tag is pushed.
# ABOUTME: macOS (Apple Silicon .dmg) and Windows (x64 NSIS .exe) attach to a draft GitHub Release.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundles: dmg
          - platform: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write # tauri-action creates the draft release and uploads assets
    steps:
      - uses: actions/checkout@v6
      - name: Verify tag matches app version
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $APP_VERSION" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Buzz ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
